name: Build QuizManna Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Assets to Android
        run: |
          npx cap copy android || true
          npx cap sync android || true

      - name: Build Debug APK with Gradle
        id: gradle_build
        continue-on-error: true
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../gradle.log

      - name: Report Gradle Log If Failed
        if: steps.gradle_build.outcome == 'failure'
        run: |
          echo "### Gradle Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 gradle.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizManna-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
